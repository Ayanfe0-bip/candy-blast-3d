<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Blast 3D | The Royal Candy Kingdom</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #180b35;
      font-family: Arial, sans-serif;
      color: white;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: fixed;
      top: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
      padding: 0 12px;
    }

    .title {
      font-size: clamp(30px, 7vw, 65px);
      font-weight: 1000;
      letter-spacing: 3px;
      color: #ffdf68;
      text-shadow:
        0 3px 0 #a94b08,
        0 6px 15px #000;
    }

    .subtitle {
      margin-top: 7px;
      font-size: clamp(11px, 2.5vw, 16px);
      letter-spacing: 4px;
      color: #fff1c4;
      font-weight: bold;
    }

    .bottom-message {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .message {
      display: inline-block;
      padding: 12px 22px;
      border: 2px solid #ffdb70;
      border-radius: 30px;
      background: rgba(54, 19, 91, 0.8);
      color: #fff1c4;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255, 204, 80, 0.3);
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #180b35;
      z-index: 20;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffdf68;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .hud {
        top: 18px;
      }

      .subtitle {
        letter-spacing: 2px;
      }

      .bottom-message {
        bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    BUILDING THE ROYAL CANDY KINGDOM...
  </div>

  <div id="game"></div>

  <div class="hud">
    <div class="title">CANDY BLAST 3D</div>
    <div class="subtitle">THE ROYAL CANDY KINGDOM</div>
  </div>

  <div class="bottom-message">
    <div class="message">MATCH • BLAST • CONQUER</div>
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x29104c);
    scene.fog = new THREE.Fog(0x29104c, 18, 55);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 9, 19);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 1.7)
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    document.getElementById('game').appendChild(
      renderer.domElement
    );

    // LIGHTING

    scene.add(new THREE.HemisphereLight(
      0xffe7ff,
      0x35105b,
      2
    ));

    const mainLight = new THREE.DirectionalLight(
      0xffe5a3,
      3
    );

    mainLight.position.set(-7, 12, 8);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const purpleLight = new THREE.PointLight(
      0xa84dff,
      35,
      30
    );

    purpleLight.position.set(6, 5, -5);
    scene.add(purpleLight);

    const pinkLight = new THREE.PointLight(
      0xff64bd,
      25,
      25
    );

    pinkLight.position.set(-7, 4, 4);
    scene.add(pinkLight);

    // MATERIALS

    const gold = new THREE.MeshStandardMaterial({
      color: 0xffc83d,
      metalness: 0.75,
      roughness: 0.22
    });

    const pink = new THREE.MeshStandardMaterial({
      color: 0xff4fa5,
      roughness: 0.3
    });

    const purple = new THREE.MeshStandardMaterial({
      color: 0x8539d8,
      roughness: 0.35
    });

    const turquoise = new THREE.MeshStandardMaterial({
      color: 0x27d9cf,
      roughness: 0.3
    });

    const white = new THREE.MeshStandardMaterial({
      color: 0xfff1e6,
      roughness: 0.4
    });

    const red = new THREE.MeshStandardMaterial({
      color: 0xf43d59,
      roughness: 0.3
    });

    const candyYellow = new THREE.MeshStandardMaterial({
      color: 0xffd735,
      roughness: 0.25
    });

    // HELPER FUNCTIONS

    function addMesh(
      geometry,
      material,
      x,
      y,
      z,
      parent = scene
    ) {
      const mesh = new THREE.Mesh(geometry, material);

      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      parent.add(mesh);
      return mesh;
    }

    function sphere(
      x, y, z, radius, material, parent = scene
    ) {
      return addMesh(
        new THREE.SphereGeometry(radius, 24, 24),
        material,
        x, y, z,
        parent
      );
    }

    function cylinder(
      x, y, z,
      radiusTop,
      radiusBottom,
      height,
      material,
      parent = scene
    ) {
      return addMesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          24
        ),
        material,
        x, y, z,
        parent
      );
    }

    // ROYAL CANDY ISLAND

    const island = new THREE.Group();
    scene.add(island);

    cylinder(
      0, -0.4, 0,
      6.5, 7.2, 1.2,
      purple,
      island
    );

    cylinder(
      0, 0.15, 0,
      6.7, 6.7, 0.25,
      gold,
      island
    );

    cylinder(
      0, 0.35, 0,
      6.5, 6.5, 0.25,
      new THREE.MeshStandardMaterial({
        color: 0x6bdbb7,
        roughness: 0.8
      }),
      island
    );

    // PALACE BASE

    const palace = new THREE.Group();
    island.add(palace);

    addMesh(
      new THREE.BoxGeometry(4.5, 3.1, 3.5),
      new THREE.MeshStandardMaterial({
        color: 0xf5b4df,
        roughness: 0.35
      }),
      0, 2.1, -0.7,
      palace
    );

    // PALACE ROOF

    const roof = addMesh(
      new THREE.ConeGeometry(3.1, 1.7, 4),
      gold,
      0, 4.45, -0.7,
      palace
    );

    roof.rotation.y = Math.PI / 4;

    // PALACE DOOR

    addMesh(
      new THREE.BoxGeometry(0.9, 1.65, 0.12),
      purple,
      0, 1.45, 1.08,
      palace
    );

    sphere(
      0.28, 1.5, 1.2,
      0.08,
      gold,
      palace
    );

    // PALACE WINDOWS

    for (const x of [-1.35, 1.35]) {
      addMesh(
        new THREE.BoxGeometry(0.65, 0.9, 0.12),
        turquoise,
        x, 2.55, 1.08,
        palace
      );

      addMesh(
        new THREE.BoxGeometry(0.12, 1.05, 0.15),
        gold,
        x, 2.55, 1.16,
        palace
      );
    }

    // PALACE TOWERS

    for (const x of [-2.2, 2.2]) {
      for (const z of [-2.1, 0.7]) {
        cylinder(
          x, 2.7, z,
          0.55, 0.65, 3.8,
          white,
          palace
        );

        const towerRoof = addMesh(
          new THREE.ConeGeometry(0.85, 1.6, 24),
          red,
          x, 5.35, z,
          palace
        );

        sphere(
          x, 6.2, z,
          0.15,
          gold,
          palace
        );

        cylinder(
          x, 4.55, z,
          0.65, 0.65, 0.15,
          gold,
          palace
        );
      }
    }

    // PALACE BALCONY

    addMesh(
      new THREE.BoxGeometry(3.5, 0.18, 0.5),
      gold,
      0, 3.55, 1.1,
      palace
    );

    for (let x = -1.5; x <= 1.5; x += 0.5) {
      cylinder(
        x, 3.8, 1.25,
        0.045, 0.045, 0.5,
        gold,
        palace
      );
    }

    // CANDY TREES

    function createCandyTree(x, z, material) {
      const tree = new THREE.Group();
      island.add(tree);

      cylinder(
        x, 1.0, z,
        0.2, 0.28, 1.5,
        gold,
        tree
      );

      sphere(
        x, 2.1, z,
        0.9,
        material,
        tree
      );

      sphere(
        x - 0.3, 2.55, z,
        0.4,
        white,
        tree
      );
    }

    createCandyTree(-4.5, -1.8, pink);
    createCandyTree(4.5, -1.8, turquoise);
    createCandyTree(-4.4, 2.5, candyYellow);
    createCandyTree(4.4, 2.5, pink);

    // GIANT LOLLIPOPS

    function createLollipop(x, z, material) {
      cylinder(
        x, 1.4, z,
        0.09, 0.09, 2.5,
        white
      );

      sphere(
        x, 2.9, z,
        0.75,
        material
      );

      sphere(
        x - 0.22, 3.15, z + 0.48,
        0.13,
        white
      );
    }

    createLollipop(-5.5, 0, red);
    createLollipop(5.5, 0, candyYellow);

    // DECORATIVE CANDIES

    const candyMaterials = [
      pink,
      turquoise,
      candyYellow,
      red,
      purple,
      white
    ];

    for (let i = 0; i < 28; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 2.5 + Math.random() * 3;

      const x = Math.cos(angle) * distance;
      const z = Math.sin(angle) * distance;

      sphere(
        x,
        0.65 + Math.random() * 0.5,
        z,
        0.18 + Math.random() * 0.2,
        candyMaterials[
          Math.floor(Math.random() * candyMaterials.length)
        ]
      );
    }

    // CLOUDS

    function createCloud(x, y, z) {
      const cloud = new THREE.Group();
      scene.add(cloud);

      cloud.position.set(x, y, z);

      sphere(0, 0, 0, 0.7, white, cloud);
      sphere(0.6, 0.1, 0, 0.6, white, cloud);
      sphere(-0.6, 0.1, 0, 0.6, white, cloud);
      sphere(0.2, 0.4, 0, 0.55, white, cloud);

      return cloud;
    }

    const clouds = [
      createCloud(-9, 7, -8),
      createCloud(9, 8, -10),
      createCloud(-10, 5, 5),
      createCloud(10, 6, 4)
    ];

    // FLOATING SPARKLES

    const sparkles = [];

    for (let i = 0; i < 100; i++) {
      const material = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0xffdf68 : 0xff8dd6
      });

      const sparkle = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 8, 8),
        material
      );

      sparkle.position.set(
        (Math.random() - 0.5) * 25,
        Math.random() * 12,
        (Math.random() - 0.5) * 20
      );

      scene.add(sparkle);
      sparkles.push(sparkle);
    }

    // ANIMATION

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      island.rotation.y = Math.sin(time * 0.2) * 0.04;

      clouds.forEach((cloud, index) => {
        cloud.position.x +=
          Math.sin(time * 0.3 + index) * 0.002;
      });

      sparkles.forEach((sparkle, index) => {
        sparkle.position.y +=
          Math.sin(time * 1.5 + index) * 0.002;

        sparkle.rotation.y += 0.01;
      });

      renderer.render(scene, camera);
    }

    animate();

    // MOBILE AND DESKTOP CAMERA MOVEMENT

    let targetX = 0;
    let targetY = 0;

    window.addEventListener('pointermove', (event) => {
      targetX =
        (event.clientX / window.innerWidth - 0.5) * 0.8;

      targetY =
        (event.clientY / window.innerHeight - 0.5) * 0.3;
    });

    function updateCamera() {
      camera.position.x +=
        (targetX - camera.position.x * 0.03) * 0.025;

      camera.position.y +=
        (9 + targetY - camera.position.y) * 0.015;

      camera.lookAt(0, 2, 0);

      requestAnimationFrame(updateCamera);
    }

    updateCamera();

    // RESPONSIVE SCREEN

    window.addEventListener('resize', () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.fov =
        window.innerWidth < 600 ? 48 : 45;

      camera.updateProjectionMatrix();

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.7)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

    // LOADING SCREEN

    setTimeout(() => {
      document.getElementById('loading').style.display =
        'none';
    }, 1800);

  </script>
</body>
  </html>
